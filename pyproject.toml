[project]
name = "braintree"
version = "0.5.0"
description = "Typed Python implementation of the Braintree Markdown graph tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
braintree = "braintree.main:main"

# Optional off-the-shelf semantic layer: CPU embedding inference through
# sentence-transformers and torch, with numpy, scikit-learn, umap-learn for
# UMAP, and the hdbscan package for HDBSCAN. A plain install stays
# dependency-free; install the extra with `uv sync --extra semantic` or
# `pip install 'braintree[semantic]'`.
[project.optional-dependencies]
semantic = [
    "hdbscan>=0.8.38",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "umap-learn>=0.5.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

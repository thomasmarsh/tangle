[project]
name = "braintree"
version = "0.6.0"
description = "Typed Python implementation of the Braintree Markdown graph tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
braintree = "braintree.main:main"

# Optional off-the-shelf semantic layer: fastembed on ONNX Runtime is the
# shipped in-process inference runtime, with numpy, scikit-learn, umap-learn
# for UMAP, and the hdbscan package for HDBSCAN. sentence-transformers on torch
# was an evaluation baseline only and does not ship here: it has no x86_64
# macOS wheel above torch 2.2.2, and torch 2.2.2 needs numpy<2, which
# contradicts fastembed's numpy>=2.1. The numba/llvmlite pins bound the
# transitive UMAP and HDBSCAN stack to versions that publish x86_64 macOS
# wheels. A plain install stays dependency-free; install the extra with
# `uv sync --extra semantic` or `pip install 'braintree[semantic]'`.
[project.optional-dependencies]
semantic = [
    "fastembed>=0.7,<0.9",
    "onnxruntime>=1.20,<1.24",
    "numpy>=2.1,<2.6",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.44",
    "numba>=0.62,<0.63",
    "llvmlite>=0.45,<0.46",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmark verification recomputes full-corpus results and rebuilds throwaway
# Git fixtures, so it is opt-in: `make test-benchmarks` runs the marked tests.
addopts = "-ra -m 'not benchmark'"
markers = [
  "benchmark: end-to-end verification of a development benchmark artifact",
]

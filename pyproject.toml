[project]
name = "braintree"
version = "0.4.0"
description = "Typed Python implementation of the Braintree Markdown graph tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bt = "braintree.cli:main"
graph-check = "braintree.graph_check:main"
feedback-scan = "braintree.feedback_scan:main"
behavioral-benchmark = "braintree.behavioral_benchmark:main"
storage-comparison = "braintree.storage_comparison:main"
token-benchmark = "braintree.token_benchmark:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
